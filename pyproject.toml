requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2,<2",       # pinned: mcp 2.x renamed FastMCP (also pinned in render.yaml — buildCommand bypasses this file)
    "psycopg[binary]>=3.1",
]
